<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8e9">
<title>我的熊熊記帳本</title>
<style>
  :root{
    --bg:#fff8e9;
    --card:#ffffff;
    --text:#5b402c;
    --muted:#9a806d;
    --line:#eee0ca;
    --brown:#9a6843;
    --green:#6da85c;
    --red:#e77b72;
    --gold:#c99a3d;
    --shadow:0 4px 15px rgba(154,104,67,.14);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
    color:var(--text);
  }

  button,input{font:inherit}

  .container{
    max-width:500px;
    margin:auto;
    padding:24px 18px 80px;
  }

  .hero{
    text-align:center;
    padding:16px 10px 14px;
  }

  .bear{
    font-size:70px;
    line-height:1;
    margin-bottom:8px;
  }

  h1{
    margin:4px 0 6px;
    font-size:30px;
  }

  .hero p{
    margin:0;
    color:var(--muted);
  }

  .card{
    background:var(--card);
    border-radius:24px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
  }

  .month-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
  }

  .month-title{
    margin:0;
    font-size:22px;
    text-align:center;
    flex:1;
  }

  .month-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#f3e7d5;
    color:var(--text);
    font-size:22px;
    font-weight:800;
  }

  .month-picker-wrap{
    display:flex;
    justify-content:center;
    margin:-6px 0 18px;
  }

  .month-picker-open{
    border:0;
    border-radius:14px;
    background:#f7eddf;
    color:var(--text);
    padding:9px 14px;
    font-weight:800;
  }

  .picker-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .picker-grid select,
  .picker-grid input{
    width:100%;
    border:1px solid #dfcfba;
    border-radius:14px;
    padding:12px 14px;
    outline:none;
    background:white;
    color:var(--text);
  }

  .summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    text-align:center;
  }

  .summary-label{
    font-size:14px;
    color:var(--muted);
    margin-bottom:4px;
  }

  .amount{
    font-size:22px;
    font-weight:800;
    white-space:nowrap;
  }

  .paid{color:var(--green)}
  .unpaid{color:var(--red)}

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:4px;
  }

  .section-title{
    margin:0;
    font-size:21px;
  }

  .mini-add{
    border:0;
    border-radius:12px;
    background:#eadcc7;
    color:var(--text);
    padding:8px 12px;
    font-weight:800;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:26px 8px 18px;
    line-height:1.7;
  }

  .item{
    display:grid;
    grid-template-columns:32px minmax(0,1fr) 112px;
    align-items:center;
    gap:10px;
    min-height:76px;
    border-bottom:1px solid var(--line);
  }

  .item:last-child{border-bottom:none}

  .check{
    width:24px;
    height:24px;
    accent-color:var(--green);
    margin:0;
  }

  .item-main{min-width:0}

  .name-line{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
  }

  .name{
    display:block;
    font-weight:800;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .fav-mark{
    color:var(--gold);
    font-size:14px;
  }

  .meta{
    display:block;
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
  }

  .row-actions{
    display:flex;
    gap:12px;
    margin-top:8px;
  }

  .edit-toggle{
    border:0;
    border-radius:12px;
    background:#f3e7d5;
    color:var(--text);
    padding:8px 12px;
    font-weight:800;
  }

  .edit-toggle.active{
    background:var(--brown);
    color:white;
  }

  .edit-input{
    width:100%;
    border:1px solid #dfcfba;
    border-radius:10px;
    padding:7px 9px;
    background:#fffaf2;
    color:var(--text);
    outline:none;
    font:inherit;
    font-weight:800;
  }

  .edit-note{
    margin-top:5px;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
  }

  .view-only-actions{
    display:none;
  }

  body.edit-mode .view-only-actions{
    display:flex;
  }

  body:not(.edit-mode) .price-input{
    pointer-events:none;
    border-color:transparent;
  }

  body:not(.edit-mode) .price-input:focus{
    background:transparent;
    border-color:transparent;
  }

  .tiny-btn{
    border:0;
    background:transparent;
    color:#b49782;
    font-size:12px;
    padding:0;
  }

  .tiny-btn.favorite{
    color:var(--gold);
  }

  .price-wrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    min-width:0;
  }

  .currency{
    position:absolute;
    left:8px;
    color:var(--text);
    font-weight:800;
    pointer-events:none;
  }

  .price-input{
    width:100%;
    border:1px solid transparent;
    border-radius:12px;
    background:transparent;
    color:var(--text);
    font:inherit;
    font-size:16px;
    font-weight:800;
    text-align:right;
    padding:9px 8px 9px 24px;
    outline:none;
  }

  .price-input:focus{
    border-color:#d9c3a6;
    background:#fffaf2;
  }


  .actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .actions > :only-child{
    grid-column:1 / -1;
  }

  .btn{
    border:0;
    border-radius:18px;
    padding:15px 12px;
    font-weight:800;
    cursor:pointer;
  }

  .btn-primary{
    background:var(--brown);
    color:white;
  }

  .btn-secondary{
    background:#eadcc7;
    color:var(--text);
  }

  .tip{
    margin:14px 4px 0;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
  }

  .import-row{
    margin-top:12px;
  }

  .btn-import{
    width:100%;
    background:#f3e7d5;
    color:var(--text);
  }

  .import-textarea{
    width:100%;
    min-height:220px;
    resize:vertical;
    border:1px solid #dfcfba;
    border-radius:16px;
    padding:14px;
    outline:none;
    background:white;
    color:var(--text);
    font:inherit;
    line-height:1.6;
  }

  .import-help{
    margin:8px 0 14px;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
  }

  .import-summary{
    margin:12px 0;
    padding:12px 14px;
    border-radius:14px;
    background:#f8efe3;
    color:var(--text);
    font-size:13px;
    line-height:1.6;
  }

  .preview-list{
    max-height:42vh;
    overflow:auto;
    display:grid;
    gap:10px;
    margin:12px 0 4px;
  }

  .preview-month{
    font-weight:900;
    margin-top:6px;
    color:var(--brown);
  }

  .preview-item{
    display:grid;
    grid-template-columns:24px minmax(0,1fr) auto;
    gap:8px;
    align-items:start;
    border:1px solid #eadcc7;
    border-radius:14px;
    padding:10px 12px;
    background:white;
  }

  .preview-status{
    font-size:16px;
    line-height:1.4;
  }

  .preview-name{
    font-weight:800;
  }

  .preview-note{
    margin-top:2px;
    color:var(--muted);
    font-size:12px;
  }

  .preview-amount{
    font-weight:800;
    white-space:nowrap;
  }

  dialog{
    width:min(92vw,420px);
    border:0;
    border-radius:24px;
    padding:0;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
  }

  dialog::backdrop{
    background:rgba(55,39,28,.28);
  }

  .dialog-body{
    padding:22px;
    background:#fffdf8;
  }

  .dialog-body h2{
    margin:0 0 16px;
  }

  .field{
    margin-bottom:14px;
  }

  .field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }

  .field input{
    width:100%;
    border:1px solid #dfcfba;
    border-radius:14px;
    padding:12px 14px;
    outline:none;
    background:white;
    color:var(--text);
  }

  .dialog-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
  }

  .favorites-list{
    display:grid;
    gap:10px;
    max-height:45vh;
    overflow:auto;
    margin-top:8px;
  }

  .favorite-choice{
    display:grid;
    grid-template-columns:24px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    border:1px solid #eadcc7;
    border-radius:14px;
    padding:10px 12px;
    background:white;
  }

  .favorite-choice input{
    width:20px;
    height:20px;
  }

  .favorite-name{
    font-weight:800;
  }

  .favorite-note{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }

  .favorite-amount{
    font-weight:800;
  }

  @media (max-width:390px){
    .item{
      grid-template-columns:30px minmax(0,1fr) 100px;
      gap:8px;
    }
    .amount{font-size:19px}
    .price-input{font-size:15px}
  }

  .month-picker-wrap{
    gap:10px;
    flex-wrap:wrap;
  }

  .year-overview{
    display:grid;
    gap:10px;
  }

  .year-month-card{
    border:1px solid #ead9c2;
    border-radius:16px;
    padding:14px;
    background:#fffaf3;
    cursor:pointer;
  }

  .year-month-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-weight:900;
    color:var(--text);
    margin-bottom:8px;
  }

  .year-month-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
  }

  .year-month-stats strong{
    display:block;
    margin-top:3px;
    color:var(--text);
    font-size:15px;
  }

  .year-total-box{
    margin:10px 0 16px;
    padding:14px;
    border-radius:16px;
    background:#f5ead8;
    color:var(--text);
    font-weight:800;
    line-height:1.8;
  }


  .fixed-list{
    display:grid;
    gap:10px;
    max-height:45vh;
    overflow:auto;
    margin-top:10px;
  }

  .fixed-card{
    border:1px solid #eadcc7;
    border-radius:16px;
    padding:12px;
    background:white;
  }

  .fixed-card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }

  .fixed-card-name{
    font-weight:900;
  }

  .fixed-card-amount{
    font-weight:900;
  }

  .fixed-card-note{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
  }

  .fixed-actions{
    display:flex;
    gap:12px;
    margin-top:10px;
  }

  .fixed-badge{
    display:inline-block;
    margin-left:5px;
    color:var(--green);
    font-size:12px;
    font-weight:900;
  }


  .home-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .more-row{
    margin-top:12px;
  }

  .more-row .btn{
    width:100%;
  }

  .more-menu{
    display:grid;
    gap:10px;
    margin-top:8px;
  }

  .more-menu .btn{
    width:100%;
    text-align:left;
    padding-left:16px;
  }

  .danger-zone{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }

  .danger-title{
    margin:0 0 10px;
    color:var(--muted);
    font-size:12px;
    font-weight:800;
  }

</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <div class="bear">🐻</div>
    <h1>我的熊熊記帳本</h1>
    <p>用心記錄每一筆 ♡</p>
  </div>

  <div class="card">
    <div class="month-row">
      <button class="month-btn" id="prevMonth">‹</button>
      <h2 class="month-title" id="monthTitle"></h2>
      <button class="month-btn" id="nextMonth">›</button>
    </div>

    <div class="month-picker-wrap">
      <button class="month-picker-open" id="openMonthPicker">📅 選擇年月</button>
    </div>

    <div class="summary">
      <div>
        <div class="summary-label">本月總額</div>
        <div class="amount" id="total">$0</div>
      </div>
      <div>
        <div class="summary-label">已繳</div>
        <div class="amount paid" id="paid">$0</div>
      </div>
      <div>
        <div class="summary-label">待繳</div>
        <div class="amount unpaid" id="unpaid">$0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2 class="section-title">本月繳費 🧾</h2>
    </div>
    <div id="items"></div>
  </div>

  <div class="home-actions">
    <button class="btn btn-primary" id="addBtn">＋ 新增繳費</button>
    <button class="btn btn-secondary" id="favoritesBtn">⭐ 常用項目</button>
  </div>

  <div class="more-row">
    <button class="btn btn-secondary" id="moreBtn">☰ 更多功能</button>
  </div>

  <div class="tip">
    新增、修改金額、勾選已繳、刪除、加入常用都會自動儲存。<br>
    每個月份的資料會分開保存。
  </div>
</div>



<dialog id="moreDialog">
  <div class="dialog-body">
    <h2>☰ 更多功能</h2>

    <div class="more-menu">
      <button class="btn btn-secondary" type="button" id="moreYearView">📊 看整年度</button>
      <button class="btn btn-secondary" type="button" id="moreFixed">🔁 固定繳費</button>
      <button class="btn btn-secondary" type="button" id="moreImport">📥 匯入備忘錄</button>
      <button class="btn btn-secondary" type="button" id="moreEdit">✏️ 編輯本月資料</button>
      <button class="btn btn-secondary" type="button" id="moreRestore">↩️ 還原上一次備份</button>
    </div>

    <div class="danger-zone">
      <div class="danger-title">資料管理</div>
      <div class="more-menu">
        <button class="btn btn-secondary" type="button" id="moreClearMonth">🗑️ 清空本月</button>
        <button class="btn btn-secondary" type="button" id="moreClearYear">🗑️ 清空整年度</button>
      </div>
    </div>

    <div class="dialog-actions">
      <button class="btn btn-primary" type="button" id="closeMore">完成</button>
    </div>
  </div>
</dialog>

<dialog id="fixedDialog">
  <div class="dialog-body">
    <h2>🔁 固定繳費</h2>
    <div class="import-help">
      設定一次後，打開新的月份時會自動加入，而且新月份會重新變成「待繳」。
    </div>

    <button class="btn btn-primary" type="button" id="newFixedBtn" style="width:100%;">＋ 新增固定繳費</button>
    <div id="fixedList" class="fixed-list"></div>

    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button" id="closeFixed">完成</button>
    </div>
  </div>
</dialog>

<dialog id="fixedEditDialog">
  <form class="dialog-body" id="fixedForm">
    <h2 id="fixedFormTitle">新增固定繳費</h2>

    <div class="field">
      <label for="fixedName">項目名稱</label>
      <input id="fixedName" autocomplete="off" required>
    </div>

    <div class="field">
      <label for="fixedAmount">金額</label>
      <input id="fixedAmount" type="number" inputmode="numeric" min="0" required>
    </div>

    <div class="field">
      <label for="fixedNote">備註（可不填）</label>
      <input id="fixedNote" autocomplete="off">
    </div>

    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button" id="cancelFixedEdit">取消</button>
      <button class="btn btn-primary" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="importDialog">
  <div class="dialog-body">
    <h2>📥 匯入備忘錄</h2>
    <div class="import-help">
      把「一整年」的備忘錄內容複製後貼在下面。<br>
      例如 114 年會自動換算成 2025 年，並依「1月繳費、2月繳費…」分開匯入。
    </div>

    <textarea id="importText" class="import-textarea" placeholder=""></textarea>

    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button" id="cancelImport">取消</button>
      <button class="btn btn-primary" type="button" id="previewImport">辨識預覽</button>
    </div>
  </div>
</dialog>

<dialog id="importPreviewDialog">
  <div class="dialog-body">
    <h2>🔎 匯入預覽</h2>
    <div id="importSummary" class="import-summary"></div>
    <div id="importPreviewList" class="preview-list"></div>

    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button" id="backToImport">返回修改</button>
      <button class="btn btn-primary" type="button" id="confirmImport">確認匯入</button>
    </div>
  </div>
</dialog>

<dialog id="monthPickerDialog">
  <div class="dialog-body">
    <h2>📅 選擇年月</h2>

    <div class="picker-grid">
      <div class="field">
        <label for="pickYear">年份</label>
        <select id="pickYear"></select>
      </div>

      <div class="field">
        <label for="pickMonth">月份</label>
        <select id="pickMonth">
          <option value="1">1 月</option>
          <option value="2">2 月</option>
          <option value="3">3 月</option>
          <option value="4">4 月</option>
          <option value="5">5 月</option>
          <option value="6">6 月</option>
          <option value="7">7 月</option>
          <option value="8">8 月</option>
          <option value="9">9 月</option>
          <option value="10">10 月</option>
          <option value="11">11 月</option>
          <option value="12">12 月</option>
        </select>
      </div>
    </div>

    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button" id="cancelMonthPicker">取消</button>
      <button class="btn btn-primary" type="button" id="confirmMonthPicker">前往</button>
    </div>
  </div>
</dialog>


<dialog id="yearViewDialog">
  <div class="dialog-body">
    <h2 id="yearViewTitle">📊 整年度</h2>
    <div id="yearViewSummary" class="import-summary"></div>
    <div id="yearViewList" class="preview-list"></div>
    <div class="dialog-actions">
      <button class="btn btn-primary" type="button" id="closeYearView">完成</button>
    </div>
  </div>
</dialog>

<dialog id="addDialog">
  <form method="dialog" class="dialog-body" id="addForm">
    <h2>新增繳費項目 🐻</h2>

    <div class="field">
      <label for="newName">項目名稱</label>
      <input id="newName" autocomplete="off" required>
    </div>

    <div class="field">
      <label for="newAmount">金額</label>
      <input id="newAmount" type="number" inputmode="numeric" min="0" required>
    </div>

    <div class="field">
      <label for="newNote">備註（可不填）</label>
      <input id="newNote" autocomplete="off">
    </div>

    <div class="field">
      <label>
        <input id="newFavorite" type="checkbox" style="width:auto;margin-right:8px;">
        同時加入 ⭐ 常用項目
      </label>
    </div>

    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button" id="cancelBtn">取消</button>
      <button class="btn btn-primary" type="submit">加入</button>
    </div>
  </form>
</dialog>

<dialog id="favoritesDialog">
  <div class="dialog-body">
    <h2>⭐ 常用項目</h2>
    <div id="favoritesList" class="favorites-list"></div>

    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button" id="closeFavorites">取消</button>
      <button class="btn btn-primary" type="button" id="addSelectedFavorites">加入本月</button>
    </div>
  </div>
</dialog>

<script>

let pendingImport = null;

function normalizeImportLine(line){
  return line
    .replace(/\u00a0/g, ' ')
    .replace(/[　\t]+/g, ' ')
    .trim();
}

function rocToAdYear(y){
  y = Number(y);
  if(!Number.isFinite(y)) return null;
  if(y >= 1 && y <= 200) return y + 1911;
  if(y >= 1900 && y <= 2200) return y;
  return null;
}

function parseYearFromText(text){
  const m = text.match(/(?:^|\s|[🐍🐉🐇🐅🐲])\s*(\d{2,4})\s*年(?:度)?/m);
  return m ? rocToAdYear(m[1]) : null;
}

function extractInstallmentNote(line){
  const m = line.match(/[（(]\s*([^()（）]{1,30})\s*[）)]\s*$/);
  return m ? m[1].trim() : '';
}

function cleanImportName(line, amountText){
  let s = line;

  // remove common checked symbols / bullets / decorative prefixes
  s = s.replace(/^[\s☑✅✔︎✔️☐□▣◼︎◻︎🔲]+/u, '');
  s = s.replace(/^[💔❤️🧾💳⬇️⭐🌼🐻📶🏠🛡️]+\s*/u, '');

  // remove trailing installment note
  s = s.replace(/[（(][^()（）]{1,30}[）)]\s*$/, '');

  // remove the detected amount and surrounding separators
  if(amountText){
    const idx = s.lastIndexOf(amountText);
    if(idx >= 0) s = s.slice(0, idx);
  }

  s = s.replace(/[：:－—–\-]\s*$/u, '');
  s = s.replace(/[：:－—–\-]\s*$/u, '');
  s = s.trim();

  return s;
}

function parseNotesImport(text){
  const year = parseYearFromText(text);
  if(!year){
    return { error:'找不到年份。請確認內容裡有像「114年」或「113年度」的文字。' };
  }

  const lines = text.split(/\r?\n/).map(normalizeImportLine);
  let month = null;
  let groupPaid = false;
  let groupName = '';
  const found = [];

  for(const raw of lines){
    if(!raw) continue;

    // Skip standalone year/decorative title lines.
    if(/^\D*\d{2,4}\s*年(?:度)?\D*$/u.test(raw) && !/月/.test(raw)) continue;

    // Month header, e.g. "💔1月繳費"
    const mm = raw.match(/(?:^|\D)(1[0-2]|0?[1-9])\s*月\s*(?:繳費|帳單|支出)?/u);
    if(mm){
      month = Number(mm[1]);
      groupPaid = false;
      groupName = '';
      continue;
    }

    if(!month) continue;

    const explicitlyPaid = /^[\s]*[☑✅✔︎✔️]/u.test(raw);

    // Locate the last plausible money amount in the line.
    // We deliberately ignore numbers inside the trailing installment note.
    const withoutNote = raw.replace(/[（(][^()（）]{1,30}[）)]\s*$/, '');
    const nums = [...withoutNote.matchAll(/(\d[\d,]*)/g)];
    let amountMatch = null;
    if(nums.length){
      amountMatch = nums[nums.length - 1];
    }

    if(!amountMatch){
      // A checked line without money is treated as a group header.
      // Its children inherit the checked state.
      const cleanedGroup = cleanImportName(raw, '');
      if(cleanedGroup){
        groupPaid = explicitlyPaid;
        groupName = cleanedGroup.replace(/[⬇️↓]+$/u,'').trim();
      }
      continue;
    }

    const amountText = amountMatch[1];
    const amount = Number(amountText.replace(/,/g,''));
    if(!Number.isFinite(amount)) continue;

    const name = cleanImportName(raw, amountText);
    if(!name) continue;

    const installment = extractInstallmentNote(raw);
    const noteParts = [];
    if(installment) noteParts.push(installment);

    // Only keep a group as a note when it adds useful context and is not redundant.
    if(groupName && !name.includes(groupName) && !groupName.includes(name)){
      if(/信用卡|銀行|分期|貸款/u.test(groupName)) noteParts.push(groupName);
    }

    found.push({
      year,
      month,
      name,
      amount,
      note: noteParts.join(' · '),
      paid: explicitlyPaid || groupPaid,
      favorite:false
    });
  }

  if(found.length === 0){
    return { error:'有找到年份和月份，但沒有辨識到「項目＋金額」。請把備忘錄內容完整貼上再試一次。' };
  }

  return { year, items:found };
}

function groupImportByMonth(parsed){
  const grouped = {};
  parsed.items.forEach(item => {
    const key = monthKey(item.year, item.month);
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(item);
  });
  return grouped;
}

function renderImportPreview(parsed){
  const grouped = groupImportByMonth(parsed);
  const keys = Object.keys(grouped).sort();

  const paidCount = parsed.items.filter(x => x.paid).length;
  document.getElementById('importSummary').textContent =
    `辨識到 ${parsed.year} 年，共 ${keys.length} 個月份、${parsed.items.length} 筆項目；其中 ${paidCount} 筆標記為已繳。`;

  const wrap = document.getElementById('importPreviewList');
  wrap.innerHTML = '';

  keys.forEach(key => {
    const [y,m] = key.split('-').map(Number);
    const title = document.createElement('div');
    title.className = 'preview-month';
    title.textContent = `${y} 年 ${m} 月`;
    wrap.appendChild(title);

    grouped[key].forEach(item => {
      const row = document.createElement('div');
      row.className = 'preview-item';
      row.innerHTML = `
        <div class="preview-status">${item.paid ? '✅' : '⬜️'}</div>
        <div>
          <div class="preview-name"></div>
          ${item.note ? '<div class="preview-note"></div>' : ''}
        </div>
        <div class="preview-amount">${money(item.amount)}</div>
      `;
      row.querySelector('.preview-name').textContent = item.name;
      const note = row.querySelector('.preview-note');
      if(note) note.textContent = item.note;
      wrap.appendChild(row);
    });
  });
}

function importParsedNotes(parsed){
  const all = loadAllMonths();
  const grouped = groupImportByMonth(parsed);
  let added = 0;
  let skipped = 0;

  Object.entries(grouped).forEach(([key, incoming]) => {
    const existing = all[key] || [];

    incoming.forEach(item => {
      // Basic duplicate protection: same name + amount + note in same month.
      const duplicate = existing.some(x =>
        String(x.name).trim() === String(item.name).trim() &&
        Number(x.amount || 0) === Number(item.amount || 0) &&
        String(x.note || '').trim() === String(item.note || '').trim()
      );

      if(duplicate){
        skipped++;
        return;
      }

      existing.push({
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        name:item.name,
        amount:item.amount,
        note:item.note || '',
        paid:!!item.paid,
        favorite:false
      });
      added++;
    });

    all[key] = existing;
  });

  saveAllMonths(all);
  return {added, skipped};
}


const MONTHS_KEY = 'bear-money-book-months-v1';
const FAVORITES_KEY = 'bear-money-book-favorites-v1';
const BACKUP_KEY = 'bear-money-book-last-backup-v1';
const FIXED_KEY = 'bear-money-book-fixed-v1';

let current = { year: 2026, month: 8 };

function monthKey(year, month){
  return `${year}-${String(month).padStart(2,'0')}`;
}

function loadAllMonths(){
  try{
    return JSON.parse(localStorage.getItem(MONTHS_KEY)) || {};
  }catch(e){
    return {};
  }
}

function saveAllMonths(all){
  localStorage.setItem(MONTHS_KEY, JSON.stringify(all));
}

function loadFavorites(){
  try{
    return JSON.parse(localStorage.getItem(FAVORITES_KEY)) || [];
  }catch(e){
    return [];
  }
}

function saveFavorites(list){
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(list));
}

function getCurrentItems(){
  const all = loadAllMonths();
  return all[monthKey(current.year,current.month)] || [];
}

function setCurrentItems(items){
  const all = loadAllMonths();
  all[monthKey(current.year,current.month)] = items;
  saveAllMonths(all);
}



function loadFixed(){
  try{
    return JSON.parse(localStorage.getItem(FIXED_KEY)) || [];
  }catch(e){
    return [];
  }
}

function saveFixed(list){
  localStorage.setItem(FIXED_KEY, JSON.stringify(list));
}

function ensureFixedForCurrentMonth(){
  const fixed = loadFixed().filter(x => x.active !== false);
  if(fixed.length === 0) return;

  const items = getCurrentItems();
  let changed = false;

  fixed.forEach(f => {
    // sourceFixedId prevents the same recurring bill from being created twice in one month.
    const exists = items.some(item => item.sourceFixedId === f.id);
    if(exists) return;

    items.push({
      id:Date.now().toString() + Math.random().toString(16).slice(2),
      name:f.name,
      amount:Number(f.amount || 0),
      note:f.note || '',
      paid:false,
      favorite:false,
      sourceFixedId:f.id
    });
    changed = true;
  });

  if(changed) setCurrentItems(items);
}

function createBackup(reason){
  const snapshot = {
    reason,
    time:new Date().toISOString(),
    months:loadAllMonths(),
    favorites:loadFavorites(),
    fixed:loadFixed()
  };
  localStorage.setItem(BACKUP_KEY, JSON.stringify(snapshot));
}

function loadBackup(){
  try{
    return JSON.parse(localStorage.getItem(BACKUP_KEY)) || null;
  }catch(e){
    return null;
  }
}

function restoreBackup(){
  const backup = loadBackup();
  if(!backup){
    alert('目前沒有可以還原的備份');
    return;
  }

  if(!confirm('要還原上一次備份嗎？目前資料會先被覆蓋。')){
    return;
  }

  // Save current state too, so accidental restore is less risky.
  const currentSnapshot = {
    reason:'還原前自動備份',
    time:new Date().toISOString(),
    months:loadAllMonths(),
    favorites:loadFavorites(),
    fixed:loadFixed()
  };

  localStorage.setItem(MONTHS_KEY, JSON.stringify(backup.months || {}));
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(backup.favorites || []));
  if(backup.fixed) localStorage.setItem(FIXED_KEY, JSON.stringify(backup.fixed));

  // The state from before restore becomes the new "last backup".
  localStorage.setItem(BACKUP_KEY, JSON.stringify(currentSnapshot));
  render();
  alert('已還原上一次備份');
}

function money(n){
  return '$' + Number(n || 0).toLocaleString('zh-TW');
}

function renderMonthTitle(){
  document.getElementById('monthTitle').textContent =
    `🌼 ${current.year} 年 ${current.month} 月`;
}

function render(){
  renderMonthTitle();
  ensureFixedForCurrentMonth();

  const items = getCurrentItems();
  const wrap = document.getElementById('items');
  wrap.innerHTML = '';

  if(items.length === 0){
    wrap.innerHTML = `
      <div class="empty">
        還沒有本月繳費項目 🐻<br>
        點「＋ 新增」或從「⭐ 常用項目」加入
      </div>
    `;
    updateSummary(items);
    return;
  }

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item' + (item.paid ? ' paid-item' : '');

    row.innerHTML = `
      <input class="check" type="checkbox" ${item.paid ? 'checked' : ''} aria-label="已繳">
      <div class="item-main">
        <div class="name-line">
          <span class="name"></span>
          ${item.favorite ? '<span class="fav-mark">★</span>' : ''}
          ${item.sourceFixedId ? '<span class="fixed-badge">🔁</span>' : ''}
        </div>
        ${item.note ? '<span class="meta"></span>' : ''}
        <div class="row-actions view-only-actions">
          <button class="tiny-btn edit-item-btn" type="button">修改文字</button>
          <button class="tiny-btn favorite" type="button">${item.favorite ? '取消常用' : '加入常用'}</button>
          <button class="tiny-btn delete-btn" type="button">刪除</button>
        </div>
      </div>
      <div class="price-wrap">
        <span class="currency">$</span>
        <input class="price-input" type="number" inputmode="numeric" min="0" value="${item.amount}">
      </div>
    `;

    row.querySelector('.name').textContent = item.name;
    const meta = row.querySelector('.meta');
    if(meta) meta.textContent = item.note;

    const check = row.querySelector('.check');
    const input = row.querySelector('.price-input');
    const editItemBtn = row.querySelector('.edit-item-btn');
    const favBtn = row.querySelector('.tiny-btn.favorite');
    const del = row.querySelector('.delete-btn');

    editItemBtn.addEventListener('click', () => {
      const main = row.querySelector('.item-main');
      const currentName = item.name || '';
      const currentNote = item.note || '';

      main.innerHTML = `
        <input class="edit-input edit-name" type="text">
        <input class="edit-input edit-note" type="text">
        <div class="row-actions">
          <button class="tiny-btn save-text-btn" type="button">儲存文字</button>
          <button class="tiny-btn cancel-text-btn" type="button">取消</button>
        </div>
      `;

      const nameInput = main.querySelector('.edit-name');
      const noteInput = main.querySelector('.edit-note');
      nameInput.value = currentName;
      noteInput.value = currentNote;
      nameInput.focus();

      main.querySelector('.save-text-btn').addEventListener('click', () => {
        const itemsNow = getCurrentItems();
        const target = itemsNow.find(x => x.id === item.id);
        if(target){
          const nextName = nameInput.value.trim();
          if(!nextName){
            alert('項目名稱不能是空白');
            return;
          }
          target.name = nextName;
          target.note = noteInput.value.trim();
          setCurrentItems(itemsNow);
          render();
        }
      });

      main.querySelector('.cancel-text-btn').addEventListener('click', () => {
        render();
      });
    });

    check.addEventListener('change', () => {
      const itemsNow = getCurrentItems();
      const target = itemsNow.find(x => x.id === item.id);
      if(target){
        target.paid = check.checked;
        setCurrentItems(itemsNow);
        render();
      }
    });

    input.addEventListener('input', () => {
      const itemsNow = getCurrentItems();
      const target = itemsNow.find(x => x.id === item.id);
      if(target){
        target.amount = Number(input.value) || 0;
        setCurrentItems(itemsNow);
        updateSummary(itemsNow);
      }
    });

    favBtn.addEventListener('click', () => {
      toggleFavorite(item.id);
    });

    del.addEventListener('click', () => {
      if(confirm(`刪除「${item.name}」嗎？`)){
        createBackup(`刪除 ${item.name}`);
        const next = getCurrentItems().filter(x => x.id !== item.id);
        setCurrentItems(next);
        render();

        if(confirm(`已刪除「${item.name}」。要立刻復原嗎？`)){
          restoreBackup();
        }
      }
    });

    wrap.appendChild(row);
  });

  updateSummary(items);
}

function updateSummary(items){
  const total = items.reduce((sum, x) => sum + Number(x.amount || 0), 0);
  const paid = items.reduce((sum, x) => sum + (x.paid ? Number(x.amount || 0) : 0), 0);

  document.getElementById('total').textContent = money(total);
  document.getElementById('paid').textContent = money(paid);
  document.getElementById('unpaid').textContent = money(total - paid);
}

function toggleFavorite(itemId){
  const items = getCurrentItems();
  const item = items.find(x => x.id === itemId);
  if(!item) return;

  let favorites = loadFavorites();

  if(item.favorite){
    item.favorite = false;
    favorites = favorites.filter(f => f.sourceId !== item.id && f.name !== item.name);
  }else{
    item.favorite = true;
    favorites.push({
      id: Date.now().toString(),
      sourceId: item.id,
      name: item.name,
      amount: Number(item.amount || 0),
      note: item.note || ''
    });
  }

  setCurrentItems(items);
  saveFavorites(favorites);
  render();
}

const addDialog = document.getElementById('addDialog');
const addForm = document.getElementById('addForm');

function openAdd(){
  addForm.reset();
  addDialog.showModal();
  setTimeout(() => document.getElementById('newName').focus(), 50);
}

document.getElementById('addBtn').addEventListener('click', openAdd);

document.getElementById('cancelBtn').addEventListener('click', () => {
  addDialog.close();
});

addForm.addEventListener('submit', (e) => {
  e.preventDefault();

  const name = document.getElementById('newName').value.trim();
  const amount = Number(document.getElementById('newAmount').value) || 0;
  const note = document.getElementById('newNote').value.trim();
  const makeFavorite = document.getElementById('newFavorite').checked;

  if(!name) return;

  const item = {
    id: Date.now().toString(),
    name,
    amount,
    note,
    paid:false,
    favorite:makeFavorite
  };

  const items = getCurrentItems();
  items.push(item);
  setCurrentItems(items);

  if(makeFavorite){
    const favorites = loadFavorites();
    favorites.push({
      id:(Date.now()+1).toString(),
      sourceId:item.id,
      name,
      amount,
      note
    });
    saveFavorites(favorites);
  }

  addDialog.close();
  render();
});

const favoritesDialog = document.getElementById('favoritesDialog');

document.getElementById('favoritesBtn').addEventListener('click', () => {
  renderFavorites();
  favoritesDialog.showModal();
});

document.getElementById('closeFavorites').addEventListener('click', () => {
  favoritesDialog.close();
});

function renderFavorites(){
  const list = document.getElementById('favoritesList');
  const favorites = loadFavorites();
  list.innerHTML = '';

  if(favorites.length === 0){
    list.innerHTML = `<div class="empty">還沒有常用項目 ⭐</div>`;
    return;
  }

  favorites.forEach(fav => {
    const row = document.createElement('label');
    row.className = 'favorite-choice';
    row.innerHTML = `
      <input type="checkbox" data-id="${fav.id}">
      <div>
        <div class="favorite-name"></div>
        ${fav.note ? '<div class="favorite-note"></div>' : ''}
      </div>
      <div class="favorite-amount">${money(fav.amount)}</div>
    `;
    row.querySelector('.favorite-name').textContent = fav.name;
    const note = row.querySelector('.favorite-note');
    if(note) note.textContent = fav.note;
    list.appendChild(row);
  });
}

document.getElementById('addSelectedFavorites').addEventListener('click', () => {
  const checked = [...document.querySelectorAll('#favoritesList input[type="checkbox"]:checked')];
  if(checked.length === 0){
    favoritesDialog.close();
    return;
  }

  const favorites = loadFavorites();
  const items = getCurrentItems();

  checked.forEach(box => {
    const fav = favorites.find(f => f.id === box.dataset.id);
    if(!fav) return;

    items.push({
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      name: fav.name,
      amount: Number(fav.amount || 0),
      note: fav.note || '',
      paid:false,
      favorite:true
    });
  });

  setCurrentItems(items);
  favoritesDialog.close();
  render();
});

function shiftMonth(delta){
  current.month += delta;

  if(current.month > 12){
    current.month = 1;
    current.year += 1;
  }else if(current.month < 1){
    current.month = 12;
    current.year -= 1;
  }

  render();
}

document.getElementById('prevMonth').addEventListener('click', () => shiftMonth(-1));
document.getElementById('nextMonth').addEventListener('click', () => shiftMonth(1));

const monthPickerDialog = document.getElementById('monthPickerDialog');

function fillYearOptions(){
  const select = document.getElementById('pickYear');
  select.innerHTML = '';

  // 年份從 2022 年開始。
  for(let year = 2022; year <= 2040; year++){
    const option = document.createElement('option');
    option.value = year;
    option.textContent = `${year} 年`;
    select.appendChild(option);
  }
}

const yearViewDialog = document.getElementById('yearViewDialog');

function renderYearView(year){
  const all = loadAllMonths();
  const list = document.getElementById('yearViewList');
  const summary = document.getElementById('yearViewSummary');

  document.getElementById('yearViewTitle').textContent = `📊 ${year} 年整年度`;
  list.innerHTML = '';
  list.className = 'year-overview';

  let yearTotal = 0;
  let yearPaid = 0;
  let yearUnpaid = 0;

  for(let month = 1; month <= 12; month++){
    const items = all[monthKey(year, month)] || [];
    const total = items.reduce((sum, item) => sum + Number(item.amount || 0), 0);
    const paid = items.filter(item => item.paid)
      .reduce((sum, item) => sum + Number(item.amount || 0), 0);
    const unpaid = total - paid;

    yearTotal += total;
    yearPaid += paid;
    yearUnpaid += unpaid;

    const card = document.createElement('div');
    card.className = 'year-month-card';
    card.innerHTML = `
      <div class="year-month-top">
        <span>🌼 ${month} 月</span>
        <span>${items.length} 筆 ›</span>
      </div>
      <div class="year-month-stats">
        <div>總額<strong>${money(total)}</strong></div>
        <div>已繳<strong>${money(paid)}</strong></div>
        <div>待繳<strong>${money(unpaid)}</strong></div>
      </div>
    `;

    card.addEventListener('click', () => {
      current.year = year;
      current.month = month;
      yearViewDialog.close();
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });

    list.appendChild(card);
  }

  summary.innerHTML = `
    <div class="year-total-box">
      全年總額：${money(yearTotal)}<br>
      已繳：${money(yearPaid)}　待繳：${money(yearUnpaid)}
    </div>
  `;
}

document.getElementById('closeYearView').addEventListener('click', () => {
  yearViewDialog.close();
});


const importDialog = document.getElementById('importDialog');
const importPreviewDialog = document.getElementById('importPreviewDialog');

document.getElementById('cancelImport').addEventListener('click', () => {
  importDialog.close();
});

document.getElementById('previewImport').addEventListener('click', () => {
  const text = document.getElementById('importText').value.trim();
  if(!text){
    alert('請先把備忘錄內容貼進來');
    return;
  }

  const parsed = parseNotesImport(text);
  if(parsed.error){
    alert(parsed.error);
    return;
  }

  pendingImport = parsed;
  renderImportPreview(parsed);
  importDialog.close();
  importPreviewDialog.showModal();
});

document.getElementById('backToImport').addEventListener('click', () => {
  importPreviewDialog.close();
  importDialog.showModal();
});

document.getElementById('confirmImport').addEventListener('click', () => {
  if(!pendingImport) return;

  createBackup('匯入備忘錄前');
  const result = importParsedNotes(pendingImport);
  importPreviewDialog.close();

  current.year = pendingImport.year;
  current.month = pendingImport.items[0].month;
  render();

  let msg = `完成！已匯入 ${result.added} 筆資料。`;
  if(result.skipped) msg += `\n另外略過 ${result.skipped} 筆看起來重複的資料。`;
  alert(msg);

  pendingImport = null;
});



let editMode = false;

function setEditMode(on){
  editMode = on;
  document.body.classList.toggle('edit-mode', editMode);
}


function clearCurrentMonth(){
  const items = getCurrentItems();

  if(items.length === 0){
    alert('這個月份目前沒有資料');
    return;
  }

  const label = `${current.year} 年 ${current.month} 月`;
  if(!confirm(`確定要清空 ${label} 的所有資料嗎？\n清空前會自動備份。`)){
    return;
  }

  createBackup(`清空 ${label} 前`);
  const all = loadAllMonths();
  all[monthKey(current.year,current.month)] = [];
  saveAllMonths(all);
  render();
  alert(`${label} 已清空。需要時可以按「↩️ 還原上一次備份」。`);
}

function clearCurrentYear(){
  const year = current.year;
  const all = loadAllMonths();
  const keys = Object.keys(all).filter(key => key.startsWith(`${year}-`));
  const count = keys.reduce((sum,key) => sum + (all[key] || []).length, 0);

  if(count === 0){
    alert(`${year} 年目前沒有資料`);
    return;
  }

  if(!confirm(`確定要清空 ${year} 年 1～12 月的所有資料嗎？\n共 ${count} 筆。\n清空前會自動備份。`)){
    return;
  }

  createBackup(`清空 ${year} 年前`);
  keys.forEach(key => delete all[key]);
  saveAllMonths(all);
  render();
  alert(`${year} 年已清空，可以重新匯入整年度備忘錄。`);
}



const fixedDialog = document.getElementById('fixedDialog');
const fixedEditDialog = document.getElementById('fixedEditDialog');
const fixedForm = document.getElementById('fixedForm');
let editingFixedId = null;

function renderFixedList(){
  const wrap = document.getElementById('fixedList');
  const list = loadFixed();
  wrap.innerHTML = '';

  if(list.length === 0){
    wrap.innerHTML = '<div class="empty">還沒有固定繳費項目 🔁</div>';
    return;
  }

  list.forEach(f => {
    const card = document.createElement('div');
    card.className = 'fixed-card';
    card.innerHTML = `
      <div class="fixed-card-top">
        <div class="fixed-card-name"></div>
        <div class="fixed-card-amount">${money(f.amount)}</div>
      </div>
      ${f.note ? '<div class="fixed-card-note"></div>' : ''}
      <div class="fixed-actions">
        <button class="tiny-btn edit-fixed" type="button">修改</button>
        <button class="tiny-btn toggle-fixed" type="button">${f.active === false ? '重新啟用' : '停止自動加入'}</button>
        <button class="tiny-btn delete-fixed" type="button">刪除設定</button>
      </div>
    `;
    card.querySelector('.fixed-card-name').textContent = f.name;
    const note = card.querySelector('.fixed-card-note');
    if(note) note.textContent = f.note;

    card.querySelector('.edit-fixed').addEventListener('click', () => {
      editingFixedId = f.id;
      document.getElementById('fixedFormTitle').textContent = '修改固定繳費';
      document.getElementById('fixedName').value = f.name;
      document.getElementById('fixedAmount').value = f.amount;
      document.getElementById('fixedNote').value = f.note || '';
      fixedEditDialog.showModal();
    });

    card.querySelector('.toggle-fixed').addEventListener('click', () => {
      const next = loadFixed();
      const target = next.find(x => x.id === f.id);
      if(target){
        target.active = target.active === false ? true : false;
        saveFixed(next);
        renderFixedList();
      }
    });

    card.querySelector('.delete-fixed').addEventListener('click', () => {
      if(confirm(`刪除固定設定「${f.name}」嗎？\n已經存在各月份的舊帳不會被刪除。`)){
        createBackup(`刪除固定繳費設定 ${f.name}`);
        saveFixed(loadFixed().filter(x => x.id !== f.id));
        renderFixedList();
      }
    });

    wrap.appendChild(card);
  });
}

document.getElementById('closeFixed').addEventListener('click', () => {
  fixedDialog.close();
  render();
});

document.getElementById('newFixedBtn').addEventListener('click', () => {
  editingFixedId = null;
  fixedForm.reset();
  document.getElementById('fixedFormTitle').textContent = '新增固定繳費';
  fixedEditDialog.showModal();
});

document.getElementById('cancelFixedEdit').addEventListener('click', () => {
  fixedEditDialog.close();
});

fixedForm.addEventListener('submit', (e) => {
  e.preventDefault();

  const name = document.getElementById('fixedName').value.trim();
  const amount = Number(document.getElementById('fixedAmount').value) || 0;
  const note = document.getElementById('fixedNote').value.trim();

  if(!name) return;

  createBackup(editingFixedId ? '修改固定繳費前' : '新增固定繳費前');
  const list = loadFixed();

  if(editingFixedId){
    const target = list.find(x => x.id === editingFixedId);
    if(target){
      target.name = name;
      target.amount = amount;
      target.note = note;
    }
  }else{
    list.push({
      id:Date.now().toString(),
      name,
      amount,
      note,
      active:true
    });
  }

  saveFixed(list);
  fixedEditDialog.close();
  renderFixedList();

  // Newly-created fixed items also appear immediately in the current month.
  ensureFixedForCurrentMonth();
  render();
});


const moreDialog = document.getElementById('moreDialog');

document.getElementById('moreBtn').addEventListener('click', () => {
  document.getElementById('moreEdit').textContent =
    editMode ? '✅ 完成編輯' : '✏️ 編輯本月資料';
  moreDialog.showModal();
});

document.getElementById('closeMore').addEventListener('click', () => {
  moreDialog.close();
});

document.getElementById('moreYearView').addEventListener('click', () => {
  moreDialog.close();
  renderYearView(current.year);
  yearViewDialog.showModal();
});

document.getElementById('moreFixed').addEventListener('click', () => {
  moreDialog.close();
  renderFixedList();
  fixedDialog.showModal();
});

document.getElementById('moreImport').addEventListener('click', () => {
  moreDialog.close();
  document.getElementById('importText').value = '';
  pendingImport = null;
  importDialog.showModal();
});

document.getElementById('moreEdit').addEventListener('click', () => {
  const next = !editMode;
  moreDialog.close();

    alert('已進入編輯模式。修改完成後，到「☰ 更多功能」點「✅ 完成編輯」。');
  }

document.getElementById('moreRestore').addEventListener('click', () => {
  moreDialog.close();
  restoreBackup();
});

document.getElementById('moreClearMonth').addEventListener('click', () => {
  moreDialog.close();
  clearCurrentMonth();
});

document.getElementById('moreClearYear').addEventListener('click', () => {
  moreDialog.close();
  clearCurrentYear();
});

render();
</script>
